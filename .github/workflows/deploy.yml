name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Physics and lap-logic checks
        run: |
          npm run test:sim
          APEX_TRACK=monte-alto npm run test:sim
          APEX_TRACK=sierra-norte npm run test:sim
      - name: Type-check and build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live site
    needs: deploy
    runs-on: ubuntu-latest
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Live page serves this build and its assets
        run: |
          set -euo pipefail
          echo "Checking $PAGE_URL"
          for attempt in $(seq 1 20); do
            if curl -fsSL "$PAGE_URL?v=$GITHUB_SHA" -o index.html && grep -q "content=\"$GITHUB_SHA\"" index.html; then
              break
            fi
            if [ "$attempt" = 20 ]; then echo "Live page is not serving build $GITHUB_SHA"; exit 1; fi
            sleep 15
          done
          echo "index.html carries build $GITHUB_SHA"
          for path in $(grep -oE '\./assets/[^"]+' index.html) hdr/rooitou_park_1k.hdr; do
            code=$(curl -sSL -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$PAGE_URL$path")
            echo "$path -> $code"
            case "$code" in 200*) ;; *) exit 1 ;; esac
          done
